<!doctype html>
<html lang="en">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0e1014;--card:#161a21;--line:#252b36;--tx:#e7e9ee;--mu:#8a93a6;--ac:#5b9dff;--ok:#3ecf8e;--wa:#f5a524;--bad:#f0506e;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px;overflow-x:hidden}
.card{min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:0 0 12px;font-weight:600}
a{color:var(--ac);text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--card);
border:1px solid var(--line);font-size:13px;color:var(--mu);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.on .dot{background:var(--ok);box-shadow:0 0 0 3px #3ecf8e33}.off .dot{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.state{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.big{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;flex:none}
.big i{width:12px;height:12px;border-radius:50%;background:var(--mu)}
.active .big{background:#f5a52422}.active .big i{background:var(--wa);animation:p 1.2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #f5a52499}100%{box-shadow:0 0 0 12px #f5a52400}}
.state b{display:block;font-size:17px}.state span{color:var(--mu);font-size:13px}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:11px 6px;cursor:pointer;line-height:1.2;
border:1px solid var(--line);background:#ffffff08;color:var(--tx)}
button:disabled{opacity:.5}
.pri{background:var(--ac);border-color:var(--ac);color:#06101f}
.cmds{margin-top:12px;display:grid;gap:6px}
.cmd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:13px;color:var(--mu);padding:8px 10px;
background:#ffffff06;border-radius:9px}
.cmd b{color:var(--tx);font-weight:600}.cmd .ok{color:var(--ok)}.cmd .bad{color:var(--bad)}
.err{display:none;margin-top:12px;padding:9px 11px;border-radius:9px;background:#f0506e14;border:1px solid #f0506e44;
color:#ffb3c1;font-size:13px;overflow-wrap:anywhere}
.latest{display:block;position:relative;margin:0 0 8px;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;cursor:zoom-in}
.latest img{width:100%;height:100%;object-fit:cover;display:block}
.latest img:not([src]){visibility:hidden}
.lload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
background:#0b0d11cc;color:#cfd5e1;font-size:13px;text-align:center;padding:12px}
.lload[hidden]{display:none}
.lload span{max-width:260px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--ac);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lctl{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.lctl button{padding:6px 12px;font-size:13px;border-radius:99px}
.lctl .every{display:flex;gap:4px;margin-left:auto}
.lctl .every button{padding:5px 9px;font-size:12px;color:var(--mu)}
.lctl .every button.sel{background:var(--ac);border-color:var(--ac);color:#06101f}
.lctl small{color:var(--mu);font-size:12px}
.latest img.stale{filter:grayscale(1) brightness(.85)}
.cap{display:flex;justify-content:space-between;gap:10px;margin:0 2px 10px;font-size:12px;color:var(--tx)}
.cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span:last-child{color:var(--mu);flex:none}
.tbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff1f}
.tbar i{display:block;height:100%;width:0;background:var(--ac)}
.tbar.late i{width:100%!important;animation:tb 1.2s ease-in-out infinite alternate}
.tbar[hidden]{display:none}
@keyframes tb{from{opacity:.25}to{opacity:1}}
.tlh{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.tlh button{padding:7px 11px;font-size:14px;border-radius:99px}
.tlh .day{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlh a{font-size:13px;padding:7px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.cal{margin:-4px 0 14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b0d11}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;font-size:14px}
.calh button{padding:4px 12px;border-radius:99px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.calg i{font-style:normal;font-size:11px;color:var(--mu);padding:2px 0}
.calg button{padding:7px 0;font-size:13px;font-weight:500;border-radius:8px;border-color:transparent;background:none;color:#4a5262}
.calg button.has{color:var(--tx);background:#ffffff0d;border-color:var(--line);font-weight:600}
.calg button.today{box-shadow:inset 0 0 0 1px var(--ac)}
.calg button.sel{background:var(--ac);border-color:var(--ac);color:#06101f}
.modal{position:fixed;inset:0;z-index:10;background:#000e;display:flex;flex-direction:column}
.modal[hidden]{display:none}
.mbar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;font-size:14px}
.mbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mbar a{font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid #ffffff33;color:#fff;white-space:nowrap}
.mbar button{padding:6px 12px;border-radius:99px;background:#ffffff14;border-color:#ffffff33}
.mstage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 8px 16px}
.mstage img,.mstage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#000}
.mmsg{color:#cfd5e1;font-size:14px;text-align:center;padding:20px}
.mnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;padding:0;
background:#0008;border-color:#ffffff33;font-size:22px;line-height:1;z-index:1}
.mnav.prev{left:8px}.mnav.next{right:8px}.mnav[hidden]{display:none}
.ev{border-top:1px solid var(--line);padding:12px 0}.ev:first-child{border-top:0;padding-top:0}
.evh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-bottom:8px}
.evh b{font-size:15px}.evh span{color:var(--mu);font-size:12px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:#ffffff10;color:var(--mu);margin-left:6px}
.tag.r{background:#5b9dff22;color:#9cc2ff}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumbs a{display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0b0d11 center/cover no-repeat;
position:relative}
.thumbs a.more{display:grid;place-items:center;color:var(--mu);font-size:13px;font-weight:600}
.clips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.clips a{font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--tx)}
.empty{color:var(--mu);font-size:14px;padding:8px 0}
.foot{color:var(--mu);font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body><main>
<header><h1>YiCam</h1><span class="pill" id="pill"><span class="dot"></span><span id="pillT">connecting…</span></span></header>

<section class="card">
 <a class="latest" id="latest" href="#"><img id="latestImg" alt="Latest photo">
  <div class="lload" id="lload"><i class="spin"></i><span id="lloadT">Starting live view…</span></div>
  <div class="tbar" id="tbar"><i></i></div></a>
 <div class="cap"><span id="latestCap"></span><span id="latestStat"></span></div>
 <div class="lctl"><button id="liveBtn">⏸ Pause</button><small>every</small><div class="every" id="every"></div></div>
 <div class="state" id="state"><div class="big"><i></i></div><div><b id="stT">–</b><span id="stS"></span></div></div>
 <div class="btns">
  <button class="pri" data-k="snap">Take<br>snapshot</button>
  <button data-k="b30">Capture<br>30 s</button>
  <button data-k="b60">Capture<br>1 min</button>
 </div>
 <div class="cmds" id="cmds"></div>
 <div class="err" id="err"></div>
</section>

<section class="card">
 <h2>Timeline</h2>
 <div class="tlh">
  <button id="prevDay" title="Previous day with photos">‹</button>
  <button class="day" id="dayBtn">–</button>
  <button id="nextDay" title="Next day with photos">›</button>
  <a id="dayDrive" href="#" title="Open this day's folder in Google Drive">Drive ↗</a>
 </div>
 <div class="cal" id="cal" hidden></div>
 <div id="tl"><div class="empty">Loading…</div></div>
</section>
<div class="foot" id="foot"></div>
</main>
<div class="modal" id="modal" hidden>
 <div class="mbar"><span id="mTitle"></span><a id="mDrive" href="#">Open in Drive</a><button id="mClose" aria-label="Close">✕</button></div>
 <div class="mstage" id="mWrap"><button class="mnav prev" id="mPrev" aria-label="Previous">‹</button>
  <div id="mStage" style="display:contents"></div><button class="mnav next" id="mNext" aria-label="Next">›</button></div>
</div>
<script>
const $ = id => document.getElementById(id);
const run = (fn, ...args) => new Promise((ok, bad) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...args));
let ST = null, DAYS = [], DAY = null, TL = null, thumbsAsked = new Set(), lastPhotos = -1;

function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? s + ' s ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
}
function err(m) { const e = $('err'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; }

function renderState(s) {
  ST = s;
  const b = s.bridge, st = b && b.status || {};
  const pollMs = (st.poll_s || 30) * 1000;
  const online = b && s.now - b.seen < Math.max(90000, 3 * pollMs);
  $('pill').className = 'pill ' + (online ? 'on' : 'off');
  $('pillT').textContent = !b ? 'bridge not seen yet' : (online ? 'online' : 'offline') + ' · ' + ago(s.now - b.seen);
  const active = online && (st.motion || st.remote);
  $('state').classList.toggle('active', !!active);
  $('stT').textContent = !online ? 'Bridge offline' : st.motion ? 'Motion detected' : st.live ? 'Live view' :
    st.remote ? 'Capturing (your request)' : 'Watching';
  $('stS').textContent = !b ? 'Waiting for the first check-in' :
    (online && st.live ? 'A frame every ' + LV.every + ' s' : 'Checks in every ' + Math.round(pollMs / 1000) + ' s') +
    ' · ' + (st.camera_connected ? 'camera connected' : 'camera not connected') +
    (st.queued ? ' · ' + st.queued + ' photo(s) waiting to upload' : '');
  err(online && st.last_error ? 'Last bridge error: ' + st.last_error : '');

  const box = $('cmds'); box.textContent = '';
  let photos = 0;
  for (const c of s.commands) {
    photos += c.photos || 0;
    const what = c.type === 'snap' ? 'Snapshot' : 'Capture ' + (c.secs >= 60 ? c.secs / 60 + ' min' : c.secs + ' s');
    let txt, cls = '';
    if (c.state === 'queued') {
      const left = Math.max(0, Math.round((pollMs - (s.now - (b ? b.seen : s.now))) / 1000));
      txt = 'waiting for the bridge' + (online ? ' (next check-in in ~' + Math.max(left, 1) + ' s)' : ' (offline)');
    } else if (c.state === 'expired') { txt = 'expired: the bridge didn’t check in'; cls = 'bad'; }
    else if (c.photos) {
      const running = c.type === 'burst' && s.now - c.taken < c.secs * 1000 + 15000;
      txt = c.photos + ' photo' + (c.photos > 1 ? 's' : '') + ' uploaded' + (running ? ', capturing…' : ''); cls = running ? '' : 'ok';
    } else txt = 'picked up, capturing…';
    const row = document.createElement('div'); row.className = 'cmd';
    const l = document.createElement('span'); const bl = document.createElement('b'); bl.textContent = what;
    l.append(bl, ' · ' + new Date(c.created).toTimeString().substr(0, 5));
    const r = document.createElement('span'); r.className = cls; r.textContent = txt;
    row.append(l, r); box.appendChild(row);
  }
  // New photos from a request: refresh today's timeline.
  if (lastPhotos >= 0 && photos > lastPhotos && DAY && DAYS[0] && DAY.id === DAYS[0].id) loadTimeline(DAY, true);
  lastPhotos = photos;
  liveLoadingText(s);
  showLatest(s.latest);
  if (s.latest && latestId === s.latest.id) updateLatestCaption(s.latest);
}

let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  if (document.hidden) return;
  pollTimer = setTimeout(poll, LV.on ? Math.min(5, LV.every) * 1000 : 5000);
}
async function poll() {
  try { renderState(await run('ui_state')); }
  catch (e) { err(String(e.message || e)); }
  schedulePoll();
}

document.querySelectorAll('.btns button').forEach(btn => btn.onclick = async () => {
  document.querySelectorAll('.btns button').forEach(b => b.disabled = true);
  try { renderState(await run('ui_capture', btn.dataset.k)); }
  catch (e) { err(String(e.message || e)); }
  setTimeout(() => document.querySelectorAll('.btns button').forEach(b => b.disabled = false), 1500);
});

function localDay(dt) {
  const p = n => String(n).padStart(2, '0');
  return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
}
function dayLabel(d) {
  const today = new Date();
  if (d === localDay(today)) return 'Today';
  if (d === localDay(new Date(today.getTime() - 86400000))) return 'Yesterday';
  return new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
// File names carry the local capture time: yyyyMMdd-HHmmss…
function nameDate(n) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/.exec(n || '');
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
}
function nameTime(n) {
  const d = nameDate(n);
  if (!d) return n || '';
  const t = d.toTimeString().substr(0, 8);
  return localDay(d) === localDay(new Date()) ? t : dayLabel(localDay(d)) + ' ' + t;
}

// --- Latest photo: the newest upload, refreshed as the bridge sends more ---
let latestId = null;
async function showLatest(l) {
  if (!l || l.id === latestId) return;
  latestId = l.id;
  const d = nameDate(l.name);
  if (d && !DAYMAP[localDay(d)]) refreshDays();  // a new day folder appeared
  try {
    const m = await run('ui_media', l.id);
    if (latestId !== l.id) return;
    const src = 'data:' + m.mime + ';base64,' + m.data;
    MEDIA[l.id] = src;
    $('latestImg').src = src;
    setLoading(false);  // there is an image now: never cover it
    const d2 = nameDate(l.name);
    if (LV.on && d2 && d2.getTime() >= LV.startedAt - 5000) {
      LV.first = true;
      timerStart(LV.every * 1000);  // a fresh frame: count down to the next one
    }
    updateStale();
    $('latest').onclick = e => { e.preventDefault(); openViewer([{ id: l.id, name: l.name, url: m.url, kind: 'photo' }], 0); };
    updateLatestCaption(l);
  } catch (e) { latestId = null; }
}
let latestName = null;
function updateLatestCaption(l) {
  latestName = l.name;
  const d = nameDate(l.name);
  $('latestCap').textContent = (/-l\.jpe?g$/i.test(l.name) ? 'Live · ' : 'Latest · ') + nameTime(l.name) +
    (d ? ' · ' + ago(Date.now() - d) : '') + (/-r\.jpe?g$/i.test(l.name) ? ' · requested' : '');
  updateStale();
}
// While waiting for a current frame, an image older than 5 minutes shows in black and white.
function updateStale() {
  const d = nameDate(latestName);
  const old = !!d && Date.now() - d.getTime() > 5 * 60 * 1000;
  $('latestImg').classList.toggle('stale', old && LV.on && !LV.first);
}

// --- Live view: frames every N s while the page is open and visible ---
const EVERY = [3, 5, 10, 30];
const LV = { on: true, every: 5, startedAt: 0, first: false, renew: null };
try {
  const v = JSON.parse(localStorage.getItem('yicamLive') || 'null');
  if (v) { LV.on = v.on !== false; if (EVERY.indexOf(v.every) >= 0) LV.every = v.every; }
} catch (e) {}
function saveLV() { try { localStorage.setItem('yicamLive', JSON.stringify({ on: LV.on, every: LV.every })); } catch (e) {} }
// The overlay is only for "nothing to show yet"; with an image, status goes to the bottom bar.
function setLoading(on, text) {
  const noImage = !$('latestImg').getAttribute('src');
  $('lload').hidden = !(on && noImage);
  if (text) $('lloadT').textContent = text;
}
// Timer line: fills until the next expected frame (or check-in); pulses when it's late.
const TM = { start: 0, end: 0 };
function timerStart(ms) { TM.start = Date.now(); TM.end = TM.start + ms; }
setInterval(() => {
  const bar = $('tbar');
  bar.hidden = !LV.on || !TM.end;
  if (bar.hidden) return;
  const now = Date.now(), late = now > TM.end + 1500;
  bar.classList.toggle('late', late);
  if (!late) bar.firstElementChild.style.width = Math.min(100, 100 * (now - TM.start) / (TM.end - TM.start)) + '%';
}, 250);
function renderLiveCtl() {
  $('liveBtn').textContent = LV.on ? '⏸ Pause' : '▶ Live view';
  const box = $('every'); box.textContent = '';
  for (const v of EVERY) {
    const b = document.createElement('button'); b.textContent = v + ' s'; b.className = v === LV.every ? 'sel' : '';
    b.onclick = () => { LV.every = v; saveLV(); renderLiveCtl(); if (LV.on && !document.hidden) liveStart(true); schedulePoll(); };
    box.appendChild(b);
  }
}
async function liveStart(keepFirst) {
  if (!keepFirst) { LV.startedAt = Date.now(); LV.first = false; setLoading(true, 'Starting live view…'); updateStale(); }
  try { renderState(await run('ui_live', 'start', LV.every)); } catch (e) { err(String(e.message || e)); }
  clearInterval(LV.renew);
  LV.renew = setInterval(() => { if (LV.on && !document.hidden) run('ui_live', 'start', LV.every).catch(() => {}); }, 60000);
}
async function liveStop() {
  clearInterval(LV.renew); LV.renew = null;
  setLoading(false); TM.end = 0; updateStale();
  $('latestStat').textContent = 'paused';
  try { await run('ui_live', 'stop'); } catch (e) {}
}
$('liveBtn').onclick = () => {
  LV.on = !LV.on; saveLV(); renderLiveCtl();
  if (LV.on) liveStart(); else liveStop();
  schedulePoll();
};
// Live status: the overlay text (only shown without any image) and the bottom bar's stats.
function liveLoadingText(s) {
  const b = s.bridge, st = b && b.status || {};
  const stat = $('latestStat');
  if (!LV.on) { stat.textContent = 'paused'; return; }
  const pollMs = (st.live ? 10 : (st.poll_s || 30)) * 1000;  // the bridge checks in every 10 s while live
  const queued = st.queued ? ' · ' + st.queued + ' waiting to upload' : '';
  if (!b || s.now - b.seen > Math.max(90000, 3 * pollMs)) {
    stat.textContent = 'bridge offline';
    if (!LV.first) TM.end = 0;
    return setLoading(true, 'Bridge offline: the live view starts when it checks in again.');
  }
  if (LV.first) { stat.textContent = 'every ' + LV.every + ' s' + queued; return; }
  if (st.remote && st.live) {
    stat.textContent = 'starting · every ' + LV.every + ' s' + queued;
    if (!TM.end || Date.now() > TM.end + 1500) timerStart(LV.every * 1000);
    return setLoading(true, 'Live view running, waiting for the first frame…');
  }
  const left = Math.max(1, Math.round((pollMs - (s.now - b.seen)) / 1000));
  stat.textContent = 'next check-in ~' + left + ' s';
  TM.start = Date.now() - (s.now - b.seen); TM.end = TM.start + pollMs;  // count down to the check-in
  setLoading(true, 'Waiting for the bridge (next check-in in ~' + left + ' s)…');
}

// --- Days and calendar ---
let DAYMAP = {}, calMonth = null;
async function refreshDays() {
  try {
    DAYS = await run('ui_days');
    DAYMAP = {}; DAYS.forEach(d => DAYMAP[d.day] = d);
    renderDayNav();
  } catch (e) {}
}
function renderDayNav() {
  if (!DAY) return;
  const i = DAYS.findIndex(d => d.id === DAY.id);
  $('dayBtn').textContent = dayLabel(DAY.day) + ' ▾';
  $('prevDay').disabled = i < 0 || i >= DAYS.length - 1;  // DAYS is newest first
  $('nextDay').disabled = i <= 0;
  $('dayDrive').href = 'https://drive.google.com/drive/folders/' + DAY.id;
  if (!$('cal').hidden) renderCal();
}
$('prevDay').onclick = () => { const i = DAYS.findIndex(d => d.id === DAY.id); if (DAYS[i + 1]) loadTimeline(DAYS[i + 1]); };
$('nextDay').onclick = () => { const i = DAYS.findIndex(d => d.id === DAY.id); if (i > 0) loadTimeline(DAYS[i - 1]); };
$('dayBtn').onclick = () => {
  const c = $('cal');
  c.hidden = !c.hidden;
  if (!c.hidden) { const d = new Date((DAY ? DAY.day : localDay(new Date())) + 'T12:00:00'); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); }
};
function renderCal() {
  const c = $('cal'); c.textContent = '';
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const head = document.createElement('div'); head.className = 'calh';
  const pb = document.createElement('button'); pb.textContent = '‹'; pb.onclick = () => { calMonth = new Date(y, mo - 1, 1); renderCal(); };
  const nb = document.createElement('button'); nb.textContent = '›'; nb.onclick = () => { calMonth = new Date(y, mo + 1, 1); renderCal(); };
  const title = document.createElement('span'); title.textContent = calMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const days = Object.keys(DAYMAP).sort();
  pb.disabled = !days.length || days[0] >= localDay(calMonth);
  nb.disabled = !days.length || days[days.length - 1] < localDay(new Date(y, mo + 1, 1));
  head.append(pb, title, nb); c.appendChild(head);
  const g = document.createElement('div'); g.className = 'calg';
  const monday = new Date(2024, 0, 1);  // a Monday, for weekday names
  for (let k = 0; k < 7; k++) {
    const i = document.createElement('i');
    i.textContent = new Date(monday.getTime() + k * 86400000).toLocaleDateString(undefined, { weekday: 'narrow' });
    g.appendChild(i);
  }
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7;  // Monday first
  for (let k = 0; k < lead; k++) g.appendChild(document.createElement('span'));
  const today = localDay(new Date());
  for (let d = 1; d <= new Date(y, mo + 1, 0).getDate(); d++) {
    const key = localDay(new Date(y, mo, d));
    const b = document.createElement('button'); b.textContent = d;
    b.className = (DAYMAP[key] ? 'has' : '') + (key === today ? ' today' : '') + (DAY && DAY.day === key ? ' sel' : '');
    b.disabled = !DAYMAP[key];
    b.onclick = () => { $('cal').hidden = true; loadTimeline(DAYMAP[key]); };
    g.appendChild(b);
  }
  c.appendChild(g);
}

async function loadTimeline(d, quiet) {
  DAY = d; renderDayNav();
  if (!quiet) $('tl').innerHTML = '<div class="empty">Loading…</div>';
  try { TL = await run('ui_timeline', d.id); if (DAY && DAY.id === d.id) renderTimeline(); }
  catch (e) { $('tl').innerHTML = ''; const m = document.createElement('div'); m.className = 'empty';
    m.textContent = 'Could not load: ' + (e.message || e); $('tl').appendChild(m); }
}

function renderTimeline() {
  const box = $('tl'); box.textContent = '';
  $('foot').textContent = '';
  if (!TL.events.length) { box.innerHTML = '<div class="empty">Nothing saved this day.</div>'; return; }
  const want = [];
  for (const ev of TL.events) {
    const e = document.createElement('div'); e.className = 'ev';
    const h = document.createElement('div'); h.className = 'evh';
    const t = document.createElement('b'); t.textContent = ev.start === ev.end ? ev.start : ev.start + '–' + ev.end;
    const tag = document.createElement('span'); tag.className = 'tag' + (ev.remote ? ' r' : '');
    tag.textContent = ev.remote ? 'requested' : 'motion'; t.appendChild(tag);
    const c = document.createElement('span');
    c.textContent = [ev.photos.length && ev.photos.length + ' photo' + (ev.photos.length > 1 ? 's' : ''),
                     ev.videos.length && ev.videos.length + ' clip' + (ev.videos.length > 1 ? 's' : '')].filter(Boolean).join(' · ');
    h.append(t, c); e.appendChild(h);
    const photos = ev.photos.map(p => Object.assign({ kind: 'photo' }, p));
    if (photos.length) {
      const g = document.createElement('div'); g.className = 'thumbs';
      const shown = photos.length > 8 ? photos.slice(0, 7) : photos;
      shown.forEach((p, idx) => {
        const a = document.createElement('a'); a.href = p.url; a.title = p.name; a.dataset.id = p.id;
        a.onclick = evt => { evt.preventDefault(); openViewer(photos, idx); };
        if (THUMBS[p.id]) a.style.backgroundImage = 'url("' + THUMBS[p.id] + '")'; else want.push(p.id);
        g.appendChild(a);
      });
      if (shown.length < photos.length) {  // opens the viewer at the first hidden photo
        const a = document.createElement('a'); a.className = 'more'; a.href = TL.folderUrl;
        a.textContent = '+' + (photos.length - shown.length);
        a.onclick = evt => { evt.preventDefault(); openViewer(photos, shown.length); };
        g.appendChild(a);
      }
      e.appendChild(g);
    }
    if (ev.videos.length) {
      const clips = ev.videos.map(v => Object.assign({ kind: 'video' }, v));
      const cl = document.createElement('div'); cl.className = 'clips';
      clips.forEach((v, idx) => {
        const a = document.createElement('a'); a.href = v.url; a.textContent = '▶ ' + v.time;
        a.onclick = evt => { evt.preventDefault(); openViewer(clips, idx); };
        cl.appendChild(a);
      });
      e.appendChild(cl);
    }
    box.appendChild(e);
  }
  loadThumbs(want.filter(id => !thumbsAsked.has(id)));
}

const THUMBS = {};
async function loadThumbs(ids) {
  for (let i = 0; i < ids.length; i += 12) {
    const batch = ids.slice(i, i + 12); batch.forEach(id => thumbsAsked.add(id));
    try {
      const got = await run('ui_thumbs', batch);
      for (const id in got) {
        THUMBS[id] = got[id];
        document.querySelectorAll('.thumbs a[data-id="' + id + '"]').forEach(a => a.style.backgroundImage = 'url("' + got[id] + '")');
      }
      batch.filter(id => !got[id]).forEach(id => thumbsAsked.delete(id));  // not ready yet: retry next refresh
    } catch (e) { batch.forEach(id => thumbsAsked.delete(id)); }
  }
}

// --- Viewer: photos and clips without leaving the page ---
const MEDIA = {};  // photo data URLs already loaded
const V = { items: [], i: 0, gen: 0, url: null };
function openViewer(items, i) {
  V.items = items; V.i = i;
  $('modal').hidden = false; document.body.style.overflow = 'hidden';
  showItem();
}
function closeViewer() {
  V.gen++; clearStage();
  $('modal').hidden = true; document.body.style.overflow = '';
}
function clearStage() {
  const v = $('mStage').querySelector('video');
  if (v) { v.pause(); v.removeAttribute('src'); }
  if (V.url) { URL.revokeObjectURL(V.url); V.url = null; }
  $('mStage').textContent = '';
}
async function showItem() {
  const it = V.items[V.i], g = ++V.gen;
  clearStage();
  $('mTitle').textContent = (it.kind === 'video' ? 'Clip · ' : 'Photo · ') + nameTime(it.name) +
    (V.items.length > 1 ? '  (' + (V.i + 1) + '/' + V.items.length + ')' : '');
  $('mDrive').href = it.url || '#';
  $('mPrev').hidden = V.i <= 0; $('mNext').hidden = V.i >= V.items.length - 1;
  const st = $('mStage');
  const place = src => { st.textContent = ''; const im = document.createElement('img'); im.src = src; im.alt = it.name || ''; st.appendChild(im); };
  if (it.kind !== 'video' && MEDIA[it.id]) return place(MEDIA[it.id]);
  const msg = document.createElement('div'); msg.className = 'mmsg';
  msg.textContent = it.kind === 'video' ? 'Loading clip (about 5 MB)…' : 'Loading…';
  st.appendChild(msg);
  try {
    const m = await run('ui_media', it.id);
    if (g !== V.gen) return;
    if (!it.url) { it.url = m.url; $('mDrive').href = m.url; }
    if (m.tooBig) { msg.textContent = 'This file is too large to show here. Use “Open in Drive”.'; return; }
    if (it.kind === 'video') {
      const bin = atob(m.data), arr = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      V.url = URL.createObjectURL(new Blob([arr], { type: m.mime }));
      const v = document.createElement('video');
      v.controls = true; v.playsInline = true; v.autoplay = true; v.src = V.url;
      st.textContent = ''; st.appendChild(v);
    } else {
      const src = 'data:' + m.mime + ';base64,' + m.data;
      if (Object.keys(MEDIA).length > 40) for (const k in MEDIA) { delete MEDIA[k]; break; }
      MEDIA[it.id] = src; place(src);
    }
  } catch (e) { if (g === V.gen) msg.textContent = 'Could not load it: ' + (e.message || e) + '. Try “Open in Drive”.'; }
}
const step = d => { const n = V.i + d; if (n >= 0 && n < V.items.length) { V.i = n; showItem(); } };
$('mPrev').onclick = () => step(-1);
$('mNext').onclick = () => step(1);
$('mClose').onclick = closeViewer;
document.addEventListener('keydown', e => {
  if ($('modal').hidden) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});
let touchX = null;
$('mWrap').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('mWrap').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50 && !$('mStage').querySelector('video')) step(dx < 0 ? 1 : -1);
});

async function start() {
  renderLiveCtl();
  if (LV.on) liveStart(); else setLoading(false);
  poll();
  await refreshDays();
  if (DAYS.length) loadTimeline(DAYS[0]);
  else $('tl').innerHTML = '<div class="empty">Nothing saved yet.</div>';
}

setInterval(() => { if (!document.hidden && DAY && DAYS[0] && DAY.id === DAYS[0].id) loadTimeline(DAY, true); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(pollTimer); if (LV.on) liveStop(); }  // background: stop frames
  else { poll(); if (LV.on) liveStart(); }
});
start();
</script>
